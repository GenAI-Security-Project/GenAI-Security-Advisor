    version: "2026-Q1"
    status: current
    format: json
    path: corpus/data-security/crosswalk-entries/
    license: CC-BY-SA-4.0
    source_repo: https://github.com/genai-security-project/GenAI-Data-Security-Initiative
    source_path: crosswalk/data/entries/
    vendored_commit: c64ac507445c7fb57209bac5fd2b0c639a0d194d
    vendored_date: "2026-08-09"
    published: "2026-03-01"
    notes: >
      41 structured entries (LLM01-10, ASI01-10, DSGAI01-21), each mapped to
      controls across 25 compliance/security frameworks (MITRE ATLAS, NIST AI
      RMF, ISO 42001, SOC 2, EU AI Act, etc). This is the machine-readable
      data behind the live crosswalk web app at
      https://genai-security-project.github.io/GenAI-Data-Security-Initiative/
      Use this for "which control does risk X map to" questions. For DSGAI
      narrative prose (attack scenario writeups), see dsgai-risk-doc-2026
      below -- that content is linked, not vendored.

