# Catalog of every document/collection in corpus/.
#
# This file is the single source of truth the skill consults to find current
# content -- SKILL.md never hardcodes file paths. To add a new resource:
#   1. Drop the file(s) in the appropriate corpus/<initiative>/ subfolder
#      (create a new version-dated folder if this supersedes something).
#   2. Add an entry below.
#   3. If this replaces an existing entry, set the old entry's status to
#      "superseded" (don't delete it -- historical queries still need it).
#   4. Open a PR. CI (.github/workflows/validate-corpus.yaml) checks that
#      every entry has its required fields and that `path` (when set) exists.
#
# status values:
#   current    -- the resource the skill should use by default
#   draft      -- real content, but unstable/pre-release; use with caveats
#   superseded -- kept for historical reference, not used by default
#   linked     -- cataloged but not vendored (e.g. PDF-only, license unclear);
#                 skill should link out rather than quote from it
#
# INDEPENDENCE: everything under corpus/ is a frozen, point-in-time copy,
# not a submodule or live reference. Changes to the upstream source repos
# (source_repo/source_path below) do NOT propagate here automatically --
# there is no sync mechanism. This is deliberate: the Advisor's behavior
# should not change underneath users because someone edited an upstream
# repo. `vendored_commit` records the exact upstream commit each entry was
# copied from, purely for provenance/auditability -- it is not consulted
# at query time and does not trigger any update. Pulling in upstream
# changes is always a manual act: re-fetch, review, PR, per the process in
# README.md.

