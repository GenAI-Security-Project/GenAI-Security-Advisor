    path: corpus/agentic-top10/0.5-candidates/
    license: CC-BY-SA-4.0
    source_repo: https://github.com/genai-security-project/GenAI-Agent-Security-Initiative
    source_path: agentic-top-10/0.5-initial-candidates/
    vendored_commit: 964f83449cf14d03f4a2677af8532bda5e46ea8b
    vendored_date: "2026-08-09"
    published: null
    notes: >
      Early candidate draft with 16 real, written-out entries under working
      names (e.g. "Memory Poisoning", "Tool Misuse"). This is NOT the same
      taxonomy or numbering as the ASI01-10 list referenced on
      genai.owasp.org -- the newer "Sprint 1" folder in the source repo
      contains only unfilled templates as of 2026-08-09, so this older
      draft is the best available real content. Category names, numbering,
      and count will likely change before a final Agentic Top 10 ships.
      Always caveat answers drawn from this as "early draft, subject to
      change" -- never present it as a finalized OWASP Top 10.

